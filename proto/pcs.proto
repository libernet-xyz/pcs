syntax = "proto3";

import "google/protobuf/any.proto";

package starkom.proto.pcs.v9;

// Identifier for the Starkom-provided SHA2-256 hash backend.
message Sha2HashBackend {}

// Identifier for the Starkom-provided Keccak-256 hash backend.
message KeccakHashBackend {}

// A batched DEEP-FRI polynomial commitment.
message Commitment {
  // Hash backend used for this commitment.
  //
  // It can be `Sha2HashBackend`, `KeccakHashBackend`, or any other user-defined tag with a
  // corresponding backend implementation.
  //
  // NOTE: in order to warrant 128-bit security in a quantum setting, all backends are required to
  // use a ~256-bit cryptographic hash.
  .google.protobuf.Any hash_backend = 1;

  // Commitment data for a batch of polynomials whose evaluations are stored in the same Merkle
  // tree.
  message Batch {
    // Root hash of the Merkle tree, stored as a 32 byte sequence.
    bytes root = 1;

    // Number of polynomials in the batch. Every leaf of the Merkle tree must have exactly this
    // number of evaluations.
    uint64 num_polys = 2;
  }

  // The polynomial batches, in commitment order. There must be at least one batch.
  repeated Batch batches = 2;

  // Merkle roots of the FRI folding argument.
  //
  // The first element is the root of the main Merkle tree, the second one is the root of the Merkle
  // tree from the first folding round, and so on until the last element which is the Merkle root of
  // the last folding round.
  //
  // This list cannot be empty because there needs to be at least the initial (unfolded) Merkle
  // tree.
  //
  // Each root hash is stored as a 32 byte sequence.
  repeated bytes fri_roots = 3;
}

// A Merkle proof for a leaf of the Merkle tree of a polynomial batch (see `Commitment.Batch`).
//
// Batching is supported at the DEEP level, so these Merkle trees have vector leaves rather than
// scalar ones: if we're batching K polynomials each leaf is the vector of their K evaluations at a
// point of the extended domain, and the hashes of these vectors are used to build the higher levels
// of the Merkle tree.
message MerkleProof {
  // The K evaluations in the opened leaf.
  //
  // Each value is a field element stored in canonical (non-Montgomery) integer form, in
  // little-endian byte order.
  repeated bytes leaf_values = 1;

  // The leaf-to-root Merkle path, excluding the root hash.
  //
  // The first element is the hash of the sibling leaf, the second element is the sibling of the
  // parent node, and so on until the sibling of the child of the root. Each hash is stored as a 32
  // byte sequence. The root hash is not stored here because all root hashes are sent separately in
  // the `Commitment`.
  repeated bytes merkle_path = 2;
}

// A FRI query.
//
// NOTE: the proven degree bound, the blowup factor, and the fold rate are not stored here because
// all queries in a proof refer to `Proof.degree_bound`, `Proof.blowup_log2`, and `Proof.fold_rate`.
message Query {
  // A Merkle proof for a coset of evaluations in a Merkle tree of the folding argument.
  //
  // At the FRI level we always work with a single polynomial (which is the DEEP quotient), so the
  // leaves of the Merkle trees are the evaluations themselves rather than hashes of them.
  //
  // The evaluations are stored in bit-reversed order: the evaluation at index `i` of a domain of
  // size `n` is stored in the leaf at position `reverse_bits(i, log2(n))`. As a result, the `2^r`
  // evaluations folded together by an `r`-fold round (at indices `i + j * n / 2^r`) are the leaves
  // of a subtree of height `r`, so a single Merkle proof opens all of them. Those evaluations are
  // at the points of a coset of the subgroup of order `2^r`. For example, with `r = 1` the coset is
  // an element at index `i` and its FRI partner at index `i + n / 2`, which are siblings.
  message LeafProof {
    // The `2^r` evaluations of the coset, in bit-reversed order (that is, in the order of the
    // leaves of the coset subtree). One of them is the evaluation at the queried index.
    //
    // Each value is a field element stored in canonical (non-Montgomery) integer form, in
    // little-endian byte order.
    repeated bytes coset_values = 1;

    // The Merkle path from the root of the coset subtree up to, but excluding, the root of the
    // tree. There are as many hashes as the height of the tree minus `r`. The verifier recomputes
    // the subtree root from the coset values.
    //
    // Each hash is stored as a 32 byte sequence. The root hash is not stored here because all root
    // hashes are sent separately in the `Commitment`.
    repeated bytes merkle_path = 2;
  }

  // The queried index of the evaluation domain. Note that this is not the position of the queried
  // leaf in the Merkle tree, because the leaves are stored in bit-reversed order (see
  // `LeafProof`).
  uint64 index = 1;

  // List of Merkle proofs for the query, each one proving the coset of the queried position that is
  // folded by the corresponding round.
  //
  // This list actually contains one entry for every Merkle tree in the folding argument, not one
  // for every round, so there must be at least one element. The number of Merkle trees is equal to
  // the number of rounds plus one.
  repeated LeafProof folds = 2;
}

// A batched DEEP-FRI proof.
message Proof {
  // Hash backend used for this proof.
  //
  // It can be `Sha2HashBackend`, `KeccakHashBackend`, or any other user-defined tag with a
  // corresponding backend implementation.
  //
  // NOTE: in order to warrant 128-bit security in a quantum setting, all backends are required to
  // use a ~256-bit cryptographic hash.
  .google.protobuf.Any hash_backend = 1;

  // The proven degree bound.
  //
  // NOTE: honest provers commit polynomials of degree strictly less than this value, but a valid
  // proof only guarantees a degree at most equal to it, because FRI bounds the degree of the DEEP
  // quotients (f(X) - f(z)) / (X - z) rather than that of the committed polynomials f(X).
  uint64 degree_bound = 2;

  // The base-2 logarithm of the blowup factor.
  uint32 blowup_log2 = 3;

  // Number of FRI folds per round.
  //
  // This is the base-2 logarithm of the folding arity: every round folds the polynomial this many
  // times (except for the last round, which performs at most the remaining folds), and every query
  // opens a coset of `2^fold_rate` evaluations in the corresponding Merkle tree. Must be greater
  // than 0.
  uint32 fold_rate = 4;

  // Number of grinding bits.
  //
  // A nonce is valid if the proof-of-work hash, interpreted as a big-endian integer, has at least
  // this many leading zero bits. This also determines the number of queries, because grinding
  // provides part of the target security level.
  uint32 grinding_bits = 5;

  // The proof-of-work nonce found by the prover.
  uint64 nonce = 6;

  // Number of committed polynomials.
  uint64 num_polys = 7;

  // A point opened by the proof.
  message Point {
    // The (off-domain) X-coordinate of a proven opening.
    bytes z = 1;

    // Evaluations of every committed polynomial in `z`.
    //
    // This array must have exactly `num_polys` elements.
    //
    // Values are stored in canonical (non-Montgomery) integer form, in little-endian byte order.
    repeated bytes v = 2;
  }

  // The points opened by the proof.
  repeated Point points = 8;

  message Opening {
    repeated MerkleProof proofs = 1;
  }

  // Merkle proofs for the points at the query positions, relative to the raw Merkle trees (not the
  // FRI folds). There's one entry for every FRI query (`openings.len() == queries.len()`).
  repeated Opening openings = 9;

  // FRI queries on the combined DEEP quotient, that is the random linear combination of the DEEP
  // quotients of all opened points. Every FRI leaf therefore holds exactly one value.
  repeated Query queries = 10;
}
