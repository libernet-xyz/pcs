syntax = "proto3";

import "google/protobuf/any.proto";

package starkom.proto.pcs.v10;

// Identifier for the Starkom-provided SHA2-256 hash backend.
//
// The type URL of this message is `type.starkom.io/starkom.proto.pcs.v10.Sha2HashBackend`.
message Sha2HashBackend {}

// Identifier for the Starkom-provided Keccak-256 hash backend.
//
// The type URL of this message is `type.starkom.io/starkom.proto.pcs.v10.KeccakHashBackend`.
message KeccakHashBackend {}

// A batched DEEP-FRI polynomial commitment.
//
// The commitment only depends on the committed polynomials, not on the points opened by a `Proof`,
// so the points can be chosen after committing.
//
// All Fiat-Shamir challenges and opened points are elements of a ~256-bit field G, but the
// committed polynomials can be defined either over G or over its base field F (e.g. G =
// Goldilocks^4 and F = Goldilocks). When G is a prime field (e.g. BlueSky) F and G coincide.
//
// Under the hood all polynomials are committed over the base field. When the user commits a batch
// defined over the extension field, all evaluations are flattened into their base field components.
// Since all Fiat-Shamir challenges must be defined over a wide ~256-bit field for security reasons,
// the DEEP quotient and FRI folds will always necessarily work on the extension field regardless of
// which field a polynomial batch was defined on.
message Commitment {
  // Hash backend used for this commitment.
  //
  // It can be a `Sha2HashBackend`, `KeccakHashBackend`, or any other user-defined tag with a
  // corresponding backend implementation.
  //
  // NOTE: in order to warrant 128-bit security in a quantum setting, all backends are required to
  // use a ~256-bit cryptographic hash.
  .google.protobuf.Any hash_backend = 1;

  // Commitment data for a batch of polynomials whose evaluations are stored in the same Merkle
  // tree.
  message Batch {
    // Root hash of the Merkle tree, stored as a 32 byte sequence.
    bytes root = 1;

    // Whether the polynomials of the batch are over the base field rather than the extension field.
    //
    // The leaves of the two kinds of batch are hashed with different domain separation tags, so
    // the root of the Merkle tree also determines this flag: a commitment with the wrong flag fails
    // verification.
    bool base_field = 2;

    // Number of polynomials in the batch.
    //
    // Every polynomial over G is committed as its `T` coordinate polynomials over F, `T` being the
    // extension degree of G over F (eg. 4 for Goldilocks^4). Every leaf of the Merkle tree has
    // exactly `num_polys` values if the polynomials are over F, and `T * num_polys` values if
    // they're over G (see `MerkleProof`).
    uint64 num_polys = 3;
  }

  // The polynomial batches, in commitment order. There must be at least one batch.
  repeated Batch batches = 2;
}

// A Merkle proof for a leaf of the Merkle tree of a polynomial batch (see `Commitment.Batch`).
//
// Batching is supported at the DEEP level, so these Merkle trees have vector leaves rather than
// scalar ones: if we're batching K polynomials each leaf holds their K evaluations at a point of
// the extended domain, and the hashes of these vectors are used to build higher levels of the tree.
//
// The leaf values are always elements of the base field F. The evaluations of polynomials over F
// are elements of F, while every evaluation of a polynomial over G is stored as its `T` coordinates
// over F, in little-endian order (`T` being the extension degree of G over F). For example, a leaf
// of a batch of 3 polynomials over Goldilocks^4 has 12 Goldilocks values.
message MerkleProof {
  // The values of the opened leaf: K elements of F if the polynomials of the batch are over F, or
  // `K * T` elements of F if they're over G.
  //
  // Each value is stored in canonical (non-Montgomery) integer form, in little-endian byte order,
  // using as many bytes as the base field requires (e.g. 32 bytes for BlueSky, 8 for Goldilocks,
  // and 4 for KoalaBear).
  repeated bytes leaf_values = 1;

  // The leaf-to-root Merkle path, excluding the root hash.
  //
  // The first element is the hash of the sibling leaf, the second element is the sibling of the
  // parent node, and so on until the sibling of the child of the root. Each hash is stored as a 32
  // byte sequence. The root hash is not stored here because the root hashes of all polynomial
  // batches are sent separately in the `Commitment`.
  repeated bytes merkle_path = 2;
}

// A FRI query.
//
// NOTE: the proven degree bound, the blowup factor, the fold rate, and the maximum number of rounds
// are not stored here because all queries in a proof refer to `Proof.degree_bound`,
// `Proof.blowup_log2`, `Proof.fold_rate`, and `Proof.max_rounds`.
message Query {
  // A Merkle proof for a coset of evaluations in a Merkle tree of the folding argument.
  //
  // At the FRI level we always work with a single polynomial (which is the DEEP quotient), so the
  // leaves of the Merkle trees are the evaluations themselves rather than hashes of them.
  //
  // The evaluations are stored in bit-reversed order: the evaluation at index `i` of a domain of
  // size `n` is stored in the leaf at position `reverse_bits(i, log2(n))`. As a result, the `2^r`
  // evaluations folded together by an `r`-fold round (at indices `i + j * n / 2^r`) are the leaves
  // of a subtree of height `r`, so a single Merkle proof opens all of them. Those evaluations are
  // at the points of a coset of the subgroup of order `2^r`. For example, with `r = 1` the coset is
  // an element at index `i` and its FRI partner at index `i + n / 2`, which are siblings.
  message LeafProof {
    // The `2^r` evaluations of the coset, in bit-reversed order (that is, in the order of the
    // leaves of the coset subtree). One of them is the evaluation at the queried index.
    //
    // Each value is an element of G stored in canonical (non-Montgomery) integer form, in
    // little-endian byte order, using as many bytes as G requires (e.g. 32 bytes for BlueSky and
    // Goldilocks^4, 31 for KoalaBear^8).
    repeated bytes coset_values = 1;

    // The Merkle path from the root of the coset subtree up to, but excluding, the root of the
    // tree. There are as many hashes as the height of the tree minus `r`. The verifier recomputes
    // the subtree root from the coset values.
    //
    // Each hash is stored as a 32 byte sequence. The root hash is not stored here because all FRI
    // root hashes are sent separately in `Proof.fri_roots`.
    repeated bytes merkle_path = 2;
  }

  // The queried index of the evaluation domain. Note that this is not the position of the queried
  // leaf in the Merkle tree, because the leaves are stored in bit-reversed order (see
  // `LeafProof`).
  uint64 index = 1;

  // List of Merkle proofs for the query, each one proving the coset of the queried position that is
  // folded by the corresponding round.
  //
  // There's exactly one entry for every folding round (see `Proof.max_rounds`), each opening a
  // coset of `2^r` evaluations with `r` being `Proof.fold_rate`, so this list is empty if there are
  // zero rounds. The value resulting from the last round, or the DEEP quotient computed from
  // `Proof.openings` if there are zero rounds, is checked against `Proof.folded_quotient`.
  repeated LeafProof folds = 2;
}

// A batched DEEP-FRI proof.
message Proof {
  // Hash backend used for this proof.
  //
  // It can be `Sha2HashBackend`, `KeccakHashBackend`, or any other user-defined tag with a
  // corresponding backend implementation.
  //
  // NOTE: in order to warrant 128-bit security in a quantum setting, all backends are required to
  // use a ~256-bit cryptographic hash.
  .google.protobuf.Any hash_backend = 1;

  // The proven degree bound.
  //
  // NOTE: honest provers commit polynomials of degree strictly less than this value, but a valid
  // proof only guarantees a degree at most equal to it, because FRI bounds the degree of the DEEP
  // quotients (f(X) - f(z)) / (X - z) rather than that of the committed polynomials f(X).
  uint64 degree_bound = 2;

  // The target security level in bits.
  //
  // Together with `blowup_log2` and `grinding_bits` it determines the number of FRI queries: every
  // query provides `blowup_log2` bits of security and grinding provides the rest, so there are
  // `max(1, ceil((security_bits - grinding_bits) / blowup_log2))` queries, with the subtraction
  // clamped to 0. The prover chooses it, so verifiers must check that it's high enough.
  uint32 security_bits = 3;

  // The base-2 logarithm of the blowup factor.
  uint32 blowup_log2 = 4;

  // Number of FRI folds per round.
  //
  // This is the base-2 logarithm of the folding arity: every round folds the polynomial exactly
  // this many times, and every query opens a coset of `2^fold_rate` evaluations in the
  // corresponding Merkle tree.
  //
  // `fold_rate` must be greater than 0.
  uint32 fold_rate = 5;

  // Maximum number of FRI folding rounds.
  //
  // The actual number of rounds is the minimum between this value and
  // `log2(degree_bound) / fold_rate`, rounded down. Rather than being folded further, the
  // polynomial resulting from the last round is sent in the clear (see `folded_quotient`). With 0
  // there's no folding at all and the whole DEEP quotient is sent in the clear.
  uint64 max_rounds = 6;

  // Number of grinding bits.
  //
  // A nonce is valid if the proof-of-work hash, interpreted as a big-endian integer, has at least
  // this many leading zero bits. This also determines the number of queries, because grinding
  // provides part of the target security level.
  uint32 grinding_bits = 7;

  // The proof-of-work nonce found by the prover.
  uint64 nonce = 8;

  // A point opened by the proof.
  message Point {
    // The (off-domain) X-coordinate of a proven opening.
    //
    // This is an element of G stored in canonical (non-Montgomery) integer form, in little-endian
    // byte order, using as many bytes as G requires (e.g. 32 bytes for BlueSky and Goldilocks^4, 31
    // for KoalaBear^8).
    bytes z = 1;

    // Evaluations of every committed polynomial in `z`, in commitment order.
    //
    // This array must have exactly one element for every committed polynomial, i.e. as many as
    // the `num_polys` of all batches of the `Commitment` put together. They're all elements of G,
    // even for polynomials over the base field F, because `z` is.
    //
    // Values are stored in the same format as `z`.
    repeated bytes v = 2;
  }

  // The points opened by the proof.
  repeated Point points = 9;

  // Merkle roots of the FRI folding argument, one for every folding round.
  //
  // The first element is the root of the Merkle tree of the DEEP quotient, the second one is the
  // root of the Merkle tree of the polynomial folded by the first round, and so on. The number of
  // rounds is determined by `degree_bound`, `fold_rate`, and `max_rounds`, and this list is empty
  // if there are zero rounds.
  //
  // Each root hash is stored as a 32 byte sequence.
  repeated bytes fri_roots = 10;

  // The coefficients of the DEEP quotient folded by all the FRI rounds, which is sent in the clear
  // rather than being folded further. With zero rounds this is the whole (unfolded) DEEP quotient.
  //
  // There are at most `degree_bound / 2^(rounds * fold_rate)` coefficients, in ascending degree
  // order. They're the coefficients of the domain-shifted polynomial, so they must be evaluated at
  // the roots of unity of the folded domain, not at the shifted domain points.
  //
  // Each coefficient is an element of G stored in canonical (non-Montgomery) integer form, in
  // little-endian byte order, using as many bytes as G requires (e.g. 32 bytes for BlueSky and
  // Goldilocks^4, 31 for KoalaBear^8).
  repeated bytes folded_quotient = 11;

  message Opening {
    repeated MerkleProof proofs = 1;
  }

  // Merkle proofs for the points at the query positions, relative to the raw Merkle trees (not the
  // FRI folds). There's one entry for every FRI query (`openings.len() == queries.len()`).
  repeated Opening openings = 12;

  // FRI queries on the combined DEEP quotient, that is the random linear combination of the DEEP
  // quotients of all opened points. Every FRI leaf therefore holds exactly one value.
  repeated Query queries = 13;
}
