[package]
name = "starkom-pcs"
version = "5.0.1"
description = "The DEEP-FRI polynomial commitment scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/pcs.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
starkom-bluesky = "3.5.1"
starkom-ff = "3.2.0"
starkom-goldilocks = "2.2.0"
starkom-poly = "4.5.1"
starkom-poseidon = { version = "3.4.1", features = ["bluesky", "goldilocks"] }
starkom-poseidon2 = { version = "6.5.1", features = ["bluesky", "goldilocks"] }
