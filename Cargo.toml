[package]
name = "starkom-pcs"
version = "10.1.0"
description = "The DEEP-FRI polynomial commitment scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/pcs.git"
readme = "README.md"
edition = "2024"
links = "starkom-pcs-v10"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
prost = "0.14.4"
prost-types = "0.14.4"
sha2 = "0.11.1"
sha3 = "0.12.0"
starkom-ff = "5.0.2"
starkom-poly = "4.6.4"
starkom-poseidon = "5.1.4"
starkom-poseidon2 = "7.1.3"

[dev-dependencies]
starkom-bluesky = "4.0.1"
starkom-goldilocks = "4.0.0"
starkom-koalabear = "2.0.0"

[build-dependencies]
prost-build = "0.14.4"
