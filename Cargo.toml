[package]
name = "starkom-pcs"
version = "6.0.2"
description = "The DEEP-FRI polynomial commitment scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/pcs.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
starkom-bluesky = { version = "3.6.0", optional = true }
starkom-ff = "3.3.0"
starkom-goldilocks = { version = "3.1.0", optional = true }
starkom-poly = "4.5.2"
starkom-poseidon = "3.7.1"
starkom-poseidon2 = "6.8.0"
starkom-schraderbrau = { version = "1.0.0", optional = true }

[features]
default = []
bluesky = ["starkom-bluesky", "starkom-poseidon/bluesky", "starkom-poseidon2/bluesky"]
goldilocks = ["starkom-goldilocks", "starkom-poseidon/goldilocks", "starkom-poseidon2/goldilocks"]
shraderbrau = ["starkom-schraderbrau", "starkom-poseidon/schraderbrau", "starkom-poseidon2/schraderbrau"]
